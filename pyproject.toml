[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipe-security"
version = "0.1.0"
description = "Free Active Directory security auditing MCP for Claude Desktop — assessment, Kerberoasting, ransomware readiness"
authors = [{name = "ActiveDirectory-AuditSec"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
homepage = "https://github.com/ActiveDirectory-AuditSec/pipe-security"
keywords = ["security", "audit", "active-directory", "windows", "mcp", "claude"]
dependencies = [
    "mcp>=1.0.0",
    "ldap3>=2.9.1",
    "keyring>=24.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
pipe-security = "pipe_security.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]
